<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07110a" />
    <meta name="description" content="Five travelers, one unreliable van, and a thousand miles to Portland." />
    <meta name="application-name" content="The Portland Trail" />
    <meta name="apple-mobile-web-app-title" content="Portland Trail" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>The Portland Trail</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
    <link rel="preload" href="./assets/fonts/portland-pixel.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <a class="brand" href="./" data-key="home" aria-label="The Portland Trail, back to the title"
          ><span class="brand-the">The </span>Portland Trail<span class="brand-mark" aria-hidden="true">✳</span></a
        >
        <div class="masthead-right">
          <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
          <button
            id="sound-toggle"
            class="text-button sound-toggle"
            type="button"
            data-key="sound"
            aria-pressed="false"
          >
            <span class="sound-icon" aria-hidden="true">♪</span><span class="sound-word">Sound</span
            ><span class="sound-state" aria-hidden="true">off</span>
          </button>
          <button id="new-journey-header" class="text-button" type="button" data-key="new-header" hidden>
            New journey
          </button>
        </div>
      </header>
      <div id="banner" class="notice" role="alert" hidden></div>
      <main id="app" tabindex="-1"></main>
      <footer class="site-footer">
        <span>One thousand miles. Questionable preparation.</span
        ><span id="build-stamp" class="build-stamp">v0.2.0 · dev</span>
      </footer>
    </div>
    <div id="toasts" class="toast-region"></div>
    <dialog id="event-dialog" class="game-dialog" aria-labelledby="event-title"></dialog>
    <dialog id="memorial-dialog" class="game-dialog memorial-dialog" aria-labelledby="memorial-title"></dialog>
    <dialog id="confirm-dialog" class="game-dialog confirm-dialog" aria-labelledby="confirm-title"></dialog>
    <dialog id="journal-dialog" class="game-dialog"></dialog>
    <dialog id="transfer-dialog" class="game-dialog"></dialog>
  </body>
</html>
